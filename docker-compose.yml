services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ban_note_development
      MYSQL_USER: MJ
      MYSQL_PASSWORD: MJ12
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ban_note_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "MJ", "-pMJ12" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ban_note_network

  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.5.0
  #   container_name: zookeeper
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #   ports:
  #     - "2181:2181"
  #   networks:
  #     - ban_note_network

  # kafka:
  #   image: 'apache/kafka:latest'
  #   container_name: schedule-service-kafka
  #   networks:
  #     - ban_note_network
  #   environment:
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
  #     KAFKA_NODE_ID: 1
  #     KAFKA_PROCESS_ROLES: broker,controller
  #     KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://schedule-service-kafka:9092
  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #     KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  #     KAFKA_NUM_PARTITIONS: 3
  #   ports:
  #     - '9095:19092'
  #     - '9096:9093'

  #   volumes:
  #     - kafka-dev-data:/var/lib/kafka/data
  #   healthcheck:
  #     test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  kafka:
    image: 'apache/kafka:latest'
    container_name: schedule-service-kafka
    networks:
      - ban_note_network
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # 브로커 리스너
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://schedule-service-kafka:9092

      # CONTROLLER 설정
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@schedule-service-kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-dev-data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server schedule-service-kafka:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: 'kafbat/kafka-ui:latest'
    container_name: kafka-ui
    networks:
      - ban_note_network
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: schedule-service-kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - '8090:8080'
    depends_on:
      kafka:
        condition: service_healthy
  app:
    build: .
    container_name: ban_note-app
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8080:3000"
      - "9090:9090"
      - "55005:55005"
    # 환경별 .env 자동 로드
    env_file:
      # - .env.${RAILS_ENV:-development}
      - .env.production
    environment:
      # RAILS_ENV: ${RAILS_ENV:-development}
      RAILS_ENV: production
      SECRET_KEY_BASE: "130de2458be350116cacaf327172a6d8cfaa0c76252590ab0aaf17103c3bc46fbfa4c61fb49572a73e7187dba060bb2706aa7446eb94a10dcbcceda539f8d0e3"
      KAFKA_BROKERS: schedule-service-kafka:9092

    volumes:
      - .:/rails
    command: bundle exec ruby grpc_service/server.rb
    networks:
      - ban_note_network

  karafka-worker:
    build: .
    container_name: ban_note-karafka
    working_dir: /rails
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      KAFKA_BROKERS: schedule-service-kafka:9092
      SECRET_KEY_BASE: "130de2458be350116cacaf327172a6d8cfaa0c76252590ab0aaf17103c3bc46fbfa4c61fb49572a73e7187dba060bb2706aa7446eb94a10dcbcceda539f8d0e3"
    volumes:
      - .:/rails
    command: bundle exec karafka server
    stdin_open: true
    tty: true
    networks:
      - ban_note_network

volumes:
  db_data:
    external: true
    name: ban_note_db_data

  kafka-dev-data:
    driver: local

networks:
  ban_note_network:
    name: ban_note_shared_network
    external: true
